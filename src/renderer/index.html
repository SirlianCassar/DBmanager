<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CairmDB Manager</title>
  <style media="not all">
    :root {
      color-scheme: dark;
      --bg: #0e0e0d;
      --panel: #191917;
      --panel-head: #1e1e1b;
      --surface: #232321;
      --surface-alt: #2b2b27;
      --control: #121211;
      --line: #34332f;
      --section: #1b1b18;
      --well: #161613;
      --text: #e9e7e2;
      --muted: #9c988f;
      --accent: #8fb9d8;
      --accent-soft: #182532;
      --danger: #e3685b;
      --ok: #5fbf82;
      --warn: #e2a64e;
      --glow: 0 0 12px -3px rgba(143, 185, 216, 0.45);
      --radius: 0;
      --box-1: 8px;
      --box-2: 6px;
      --box-3: 4px;
      font-family: Arial, Helvetica, sans-serif;
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body { margin: 0; overflow: hidden; background: var(--bg); color: var(--text); font-weight: 400; }
    button, input, select, textarea { font: inherit; }
    button {
      min-height: 34px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--control);
      color: var(--text);
      font-weight: 700;
      cursor: pointer;
    }
    button.primary { border-color: var(--accent); background: var(--accent); color: #07131d; }
    button.small {
      min-height: 28px;
      padding: 4px 8px;
      font-size: 12px;
    }
    button.icon {
      width: 28px;
      min-height: 28px;
      height: 28px;
      padding: 0;
      display: inline-grid;
      place-items: center;
      font-size: 18px;
      line-height: 1;
    }
    button.danger { border-color: rgba(180, 35, 24, 0.35); color: var(--danger); }
    button:disabled { cursor: not-allowed; opacity: 0.55; }
    input, select, textarea {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--control);
      color: var(--text);
      padding: 8px 10px;
      outline: none;
    }
    textarea { min-height: 74px; resize: vertical; }
    input:focus, select:focus, textarea:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 1px var(--accent), var(--glow);
    }

    .app { height: 100vh; display: grid; grid-template-rows: auto minmax(0, 1fr); }
    header {
      position: sticky;
      top: 0;
      z-index: 20;
      display: grid;
      gap: 9px;
      padding: 10px 16px;
      border-bottom: 1px solid var(--line);
      background: var(--panel);
    }
    .topbar, .toolbar, .tabs, .actions { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .toolbar-spacer { flex: 1; }
    .topbar { justify-content: space-between; gap: 16px; }
    h1 { margin: 0; font-size: 21px; font-weight: 700; line-height: 1.2; letter-spacing: 0.01em; }
    .status { color: var(--muted); font-size: 13px; font-weight: 400; text-align: right; }
    .tab {
      min-height: 36px;
      padding: 8px 13px;
      border-radius: var(--radius);
      color: var(--muted);
    }
    .tab[aria-selected="true"] {
      border-color: var(--accent);
      background: var(--accent-soft);
      color: var(--accent);
    }
    main { min-height: 0; overflow: hidden; padding: 12px; }
    .view { display: none; min-height: 0; height: 100%; }
    .view.is-active { display: block; }
    .split {
      display: grid;
      grid-template-columns: minmax(300px, 390px) minmax(0, 1fr);
      gap: 14px;
      height: 100%;
      min-height: 0;
      align-items: start;
    }
    .panel {
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
      min-height: 0;
      border-radius: var(--radius);
      background: var(--panel);
      overflow: hidden;
      height: 100%;
    }
    .editor-panel {
      max-height: 100%;
    }
    .panel-head {
      display: grid;
      gap: 9px;
      padding: 10px;
      background: var(--panel-head);
    }
    h2 {
      margin: 0;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.04em;
      line-height: 1.2;
      text-transform: uppercase;
    }
    .stack { display: grid; align-content: start; gap: 9px; padding: 10px; overflow: auto; min-height: 0; }
    .head-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }
    .title-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: start;
      gap: 10px;
    }
    .field { display: grid; gap: 5px; }
    .compact-select {
      min-height: 28px;
      width: auto;
      max-width: 100%;
      padding: 4px 28px 4px 8px;
      font-size: 12px;
      font-weight: 400;
    }
    .service-head .compact-select {
      flex: 1 1 110px;
      min-width: 0;
      max-width: 180px;
    }
    .inline-select {
      width: auto;
      min-height: 26px;
      padding: 3px 24px 3px 0;
      border-color: transparent;
      background: transparent;
      color: var(--accent);
      font-size: 12px;
      font-weight: 700;
    }
    .sort-row {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 8px;
      align-items: center;
    }
    .grid-2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
    .grid-3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
    label { color: var(--muted); font-size: 11px; font-weight: 400; text-transform: uppercase; letter-spacing: 0.03em; }
    .list { display: grid; gap: 7px; }
    .item {
      display: grid;
      gap: 4px;
      width: 100%;
      min-height: 0;
      padding: 9px 10px;
      text-align: left;
      border-radius: var(--radius);
      background: var(--surface);
    }
    .item.is-active { background: var(--accent-soft); box-shadow: inset 3px 0 0 var(--accent); }
    .item.is-checked {
      background: rgba(95, 191, 130, 0.24);
      box-shadow: inset 3px 0 0 rgba(95, 191, 130, 0.78);
    }
    .item.is-active.is-checked {
      background: rgba(95, 191, 130, 0.34);
      box-shadow: inset 3px 0 0 var(--ok), 0 0 0 1px rgba(95, 191, 130, 0.42);
    }
    .item.has-no-data {
      background: rgba(217, 45, 32, 0.16);
      box-shadow: inset 3px 0 0 rgba(217, 45, 32, 0.78);
    }
    .item.is-active.has-no-data {
      background: rgba(217, 45, 32, 0.24);
      box-shadow: inset 3px 0 0 var(--danger), 0 0 0 1px rgba(217, 45, 32, 0.34);
    }
    .item strong, .row-title { display: block; font-size: 13px; font-weight: 700; line-height: 1.25; }
    .meta { color: var(--muted); font-size: 12px; font-weight: 400; line-height: 1.3; }
    .badge {
      display: inline-flex;
      align-items: center;
      min-height: 22px;
      padding: 2px 7px;
      border-radius: 0;
      background: #eef2f6;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
    }
    .badge.yes { background: #dcfae6; color: var(--ok); }
    .badge.no { background: #fee4e2; color: var(--danger); }
    .badge.temp { background: #fef0c7; color: var(--warn); }
    [data-theme="dark"] .badge { background: #2a2a25; }
    [data-theme="dark"] .badge.yes { background: #1d2c1c; }
    [data-theme="dark"] .badge.no { background: #33211e; }
    [data-theme="dark"] .badge.temp { background: #332813; }
    .zone-tabs { display: flex; flex-wrap: wrap; gap: 5px; }
    .zone-tab { min-height: 28px; padding: 4px 9px; color: var(--muted); font-size: 12px; }
    .zone-tab.is-active { color: var(--text); box-shadow: 0 0 11px -2px currentColor; }
    .zone-tab.is-active.region-europe { background: rgba(41, 255, 135, 0.24); border-color: rgba(41, 255, 135, 0.78); color: #dfffea; }
    .zone-tab.is-active.region-usa { background: rgba(32, 200, 255, 0.24); border-color: rgba(32, 200, 255, 0.78); color: #e2f8ff; }
    .zone-tab.is-active.region-canada { background: rgba(255, 204, 0, 0.24); border-color: rgba(255, 204, 0, 0.78); color: #fff4b8; }
    .zone-tab.is-active.region-hong_kong_taiwan { background: rgba(156, 255, 122, 0.24); border-color: rgba(156, 255, 122, 0.78); color: #ecffe6; }
    .zone-tab.is-active.region-australia { background: rgba(255, 93, 82, 0.24); border-color: rgba(255, 93, 82, 0.78); color: #ffe1de; }
    .zone-tab.is-active.region-rest_of_world { background: rgba(255, 122, 0, 0.24); border-color: rgba(255, 122, 0, 0.78); color: #ffe3c2; }
    .data-card {
      display: grid;
      gap: 10px;
      padding: 12px;
      border-radius: var(--box-1);
      background: var(--surface);
      box-shadow: 0 2px 10px -6px rgba(0, 0, 0, 0.7);
    }
    .editor-header {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: start;
      gap: 14px;
      padding-bottom: 2px;
    }
    .editor-title {
      display: grid;
      gap: 8px;
      min-width: 0;
    }
    .title-inline {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 6px 10px;
      min-width: 0;
    }
    .editor-title .row-title {
      font-size: 16px;
    }
    .editor-id {
      color: var(--muted);
      font-size: 13px;
      font-weight: 400;
      letter-spacing: 0.02em;
    }
    .editor-section {
      display: grid;
      gap: 9px;
      padding: 10px;
      border-radius: var(--box-2);
      background: var(--section);
    }
    .section-title {
      margin: 0;
      color: var(--muted);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }
    .service-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(160px, 1fr));
      gap: 10px;
    }
    .service-grid.three {
      grid-template-columns: repeat(3, minmax(170px, 1fr));
    }
    .service-card {
      display: grid;
      gap: 8px;
      padding: 9px;
      border-radius: var(--box-3);
      background: var(--well);
    }
    .service-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      min-height: 28px;
      min-width: 0;
    }
    .service-head-actions {
      display: flex;
      align-items: center;
      justify-content: end;
      gap: 8px;
      min-width: 0;
      flex: 1 1 auto;
    }
    .service-head > label {
      flex: 0 0 auto;
    }
    .service-head-actions .checkline {
      flex: 0 0 auto;
      white-space: nowrap;
    }
    .form-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }
    .table-wrap { overflow: auto; border-radius: var(--radius); background: var(--surface); }
    table { width: 100%; border-collapse: collapse; min-width: 920px; }
    th, td { padding: 8px 10px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
    th { position: sticky; top: 0; background: var(--surface-alt); color: var(--muted); font-size: 11px; text-transform: uppercase; z-index: 1; }
    td { background: var(--surface); color: var(--text); }
    .fee-row, .sku-row, .product-row, .selected-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 120px auto;
      align-items: center;
      gap: 8px;
    }
    .sku-row {
      grid-template-columns: minmax(220px, 0.7fr) minmax(280px, 1.3fr) auto;
      align-items: start;
      padding: 10px;
      background: var(--well);
    }
    .sku-row textarea { min-height: 82px; }
    .sku-editor-card {
      gap: 12px;
    }
    .sku-editor-card .editor-section {
      gap: 8px;
      padding: 11px;
    }
    .sku-section-titlebar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      min-width: 0;
    }
    .sku-section-titlebar .section-title {
      color: var(--text);
      font-size: 12px;
      text-transform: none;
    }
    .sku-optional,
    .sku-count {
      color: var(--muted);
      font-size: 11px;
      font-weight: 400;
    }
    .sku-default-input {
      min-height: 38px;
      font-weight: 700;
    }
    .sku-region-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(280px, 1fr));
      gap: 7px;
    }
    .sku-region-row {
      display: grid;
      grid-template-columns: minmax(128px, 0.55fr) minmax(0, 1fr);
      align-items: center;
      gap: 8px;
      min-width: 0;
      padding: 7px;
      border: 1px solid transparent;
      background: var(--well);
    }
    .sku-region-row.has-value {
      border-color: rgba(143, 185, 216, 0.28);
      background: rgba(24, 37, 50, 0.48);
    }
    .sku-region-row .region-pill {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .sku-region-row input {
      min-width: 0;
      min-height: 34px;
      padding-block: 6px;
    }
    .sku-list-head {
      display: grid;
      grid-template-columns: minmax(220px, 0.7fr) minmax(280px, 1.3fr) 34px;
      gap: 8px;
      padding: 0 8px;
      color: var(--muted);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }
    .sku-country-row {
      grid-template-columns: minmax(220px, 0.7fr) minmax(280px, 1.3fr) 34px;
      align-items: center;
      gap: 8px;
      padding: 7px;
      border: 1px solid transparent;
    }
    .sku-country-row:focus-within {
      border-color: rgba(143, 185, 216, 0.34);
    }
    .sku-country-row select,
    .sku-country-row input {
      min-width: 0;
      min-height: 34px;
      padding-block: 6px;
    }
    .sku-remove {
      width: 34px !important;
      height: 34px !important;
      min-height: 34px !important;
      color: var(--danger);
      font-size: 19px !important;
    }
    .sku-remove:hover {
      border-color: var(--danger);
      background: rgba(227, 104, 91, 0.12);
    }
    .product-row, .selected-row {
      grid-template-columns: minmax(0, 1fr) auto;
      padding: 8px 10px;
      border-radius: var(--radius);
      background: var(--well);
    }
    .empty {
      padding: 14px;
      border-radius: var(--box-2);
      background: var(--well);
      color: var(--muted);
      font-size: 13px;
      font-weight: 400;
      text-align: center;
    }
    .toggle-row {
      display: flex;
      align-items: center;
      gap: 8px;
      min-height: 30px;
    }
    .switch {
      position: relative;
      width: 48px;
      height: 24px;
      flex: 0 0 auto;
    }
    .switch input {
      position: absolute;
      inset: 0;
      opacity: 0;
      cursor: pointer;
    }
    .slider {
      position: absolute;
      inset: 0;
      border: 1px solid rgba(224, 111, 98, 0.75);
      border-radius: 999px;
      background: #6b2b26;
      box-shadow: inset 0 0 0 1px rgba(224, 111, 98, 0.16);
    }
    .slider::after {
      content: "";
      position: absolute;
      width: 18px;
      height: 18px;
      left: 2px;
      top: 2px;
      border-radius: 50%;
      background: #d8dcdf;
      box-shadow: none;
      transition: transform 0.16s ease;
    }
    .switch input:checked + .slider {
      background: #24734a;
      border-color: rgba(86, 184, 122, 0.8);
      box-shadow: inset 0 0 0 1px rgba(86, 184, 122, 0.16);
    }
    .switch input:checked + .slider::after { transform: translateX(24px); }
    .toggle-state {
      min-width: 34px;
      font-size: 13px;
      font-weight: 700;
    }
    .toggle-state.yes { color: var(--ok); }
    .toggle-state.no { color: var(--danger); }
    .toggle-state.temp { color: var(--warn); }
    .toggle-row.is-temp .slider {
      background: #795420;
      border-color: rgba(216, 162, 76, 0.82);
      box-shadow: inset 0 0 0 1px rgba(216, 162, 76, 0.16);
    }
    .toggle-row.is-temp .slider::after {
      background: #ded6c6;
      transform: translateX(12px);
    }
    .checkline {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 400;
      text-transform: none;
    }
    .checkline input { width: 15px; height: 15px; padding: 0; accent-color: var(--ok); }
    .region-pill {
      display: inline-flex;
      align-items: center;
      min-height: 22px;
      padding: 2px 8px;
      border-radius: 0;
      font-size: 12px;
      font-weight: 700;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    .region-europe { color: #29ff87; background: rgba(41, 255, 135, 0.1); border-color: rgba(41, 255, 135, 0.38); }
    .region-usa { color: #20c8ff; background: rgba(32, 200, 255, 0.12); border-color: rgba(32, 200, 255, 0.42); }
    .region-canada { color: #ffcc00; background: rgba(255, 204, 0, 0.12); border-color: rgba(255, 204, 0, 0.42); }
    .region-hong_kong_taiwan { color: #9cff7a; background: rgba(156, 255, 122, 0.1); border-color: rgba(156, 255, 122, 0.38); }
    .region-australia { color: #ff5d52; background: rgba(255, 93, 82, 0.12); border-color: rgba(255, 93, 82, 0.42); }
    .region-rest_of_world { color: #ff7a00; background: rgba(255, 122, 0, 0.12); border-color: rgba(255, 122, 0, 0.42); }
    .note-large { min-height: 132px; }
    .hidden { display: none !important; }
    .drag-handle {
      width: 22px;
      min-height: 34px;
      display: grid;
      place-items: center;
      color: var(--muted);
      cursor: grab;
      font-weight: 700;
      letter-spacing: -2px;
    }
    .selected-row {
      grid-template-columns: auto minmax(0, 1fr) auto;
    }
    .selected-row.is-dragging { opacity: 0.55; }
    .ok { color: var(--ok); }
    .dirty { color: var(--warn); }

    @media (max-width: 1180px) {
      .sku-region-grid { grid-template-columns: 1fr; }
      .sku-list-head,
      .sku-country-row {
        grid-template-columns: minmax(160px, 0.7fr) minmax(180px, 1.3fr) 34px;
      }
    }

    @media (max-width: 980px) {
      .split { grid-template-columns: 1fr; min-height: 0; overflow: auto; align-content: start; }
      .panel { min-height: 360px; }
      .grid-2, .grid-3, .fee-row, .sku-row, .service-grid, .service-grid.three, .form-grid { grid-template-columns: 1fr; }
      .sku-region-grid { grid-template-columns: 1fr; }
      .sku-region-row { grid-template-columns: minmax(120px, 0.55fr) minmax(0, 1fr); }
      .sku-list-head { display: none; }
      .sku-country-row { grid-template-columns: 1fr; }
      .sku-country-row .sku-remove { justify-self: end; }
    }

    /* Shell layout: compact database workbench — keeps the existing Cairm visual language. */
    :root {
      color-scheme: dark;
      --bg: #0e0e0d;
      --panel: #191917;
      --panel-head: #1e1e1b;
      --surface: #232321;
      --surface-alt: #2b2b27;
      --control: #121211;
      --line: #34332f;
      --section: #1b1b18;
      --well: #161613;
      --text: #e9e7e2;
      --muted: #9c988f;
      --accent: #8fb9d8;
      --accent-soft: #182532;
      --danger: #e3685b;
      --ok: #5fbf82;
      --warn: #e2a64e;
      --glow: 0 0 12px -3px rgba(143, 185, 216, 0.45);
      --box-1: 0;
      --box-2: 0;
      --box-3: 0;
    }
    body { padding: 8px; background: var(--bg); font-weight: 400; }
    .app {
      height: calc(100vh - 16px);
      border: 1px solid var(--line);
      background: var(--panel);
      grid-template-rows: auto minmax(0, 1fr);
    }
    header { position: static; gap: 0; padding: 0; border-bottom: 1px solid var(--line); background: var(--panel); }
    .topbar { min-height: 62px; align-items: stretch; gap: 0; }
    h1 {
      display: grid;
      place-items: center start;
      width: 160px;
      margin: 0;
      padding: 0 26px;
      border-right: 1px solid var(--line);
      font-size: 27px;
      font-weight: 400;
      letter-spacing: .12em;
      line-height: 1;
      white-space: nowrap;
    }
    .status { display: none; }
    .top-actions { display: flex; align-items: center; gap: 12px; margin-left: auto; padding: 10px 24px; }
    button {
      min-height: 36px;
      padding: 6px 12px;
      border-color: var(--line);
      background: var(--control);
      color: var(--text);
      font-weight: 400;
    }
    button.primary { border-color: var(--accent); background: var(--accent); color: #07131d; }
    button:hover:not(:disabled), .tab:hover { background: var(--surface-alt); }
    .utility-hidden { display: none; }
    .toolbar { min-height: 56px; gap: 0; border-top: 0; }
    .tabs { height: 56px; gap: 0; flex-wrap: nowrap; }
    .tab {
      min-width: 108px;
      height: 56px;
      min-height: 56px;
      margin: 0;
      padding: 8px 20px;
      border-width: 0 1px 0 0;
      border-color: var(--line);
      color: var(--text);
      font-size: 16px;
    }

  <script>
    (() => {
      const STORAGE_KEY = "cairmdb-manager-draft";
      const RMA_LOCATION_IDS = ["L001", "L002", "L003", "L004"];
      const ZONES = ["europe", "usa", "canada", "hong_kong_taiwan", "australia", "rest_of_world"];
      const STATUS = ["yes", "no", "temp"];
      const EXCHANGE_STATUS = ["retailer", "us", "temp", "no"];
      const state = { db: null, sourceDb: null, activeView: "home", selectedCountryId: "", selectedProductId: "", selectedSkuProductId: "", selectedBundleId: "", previousCountryId: "", previousProductId: "", previousSkuProductId: "", previousBundleId: "", selectedZone: "europe", countrySort: "alpha", productSort: "alpha", skuProductSort: "alpha", bundleSort: "alpha", listFilters: { countries: { validated: false, unvalidated: false, empty: false }, products: { validated: false, unvalidated: false, empty: false }, skus: { validated: false, unvalidated: false, empty: false }, bundles: { validated: false, unvalidated: false } }, dirty: false };
      let copyFeedbackTimer = 0;
      const $ = (id) => document.getElementById(id);
      const els = {
        status: $("status"),
        tabs: Array.from(document.querySelectorAll(".tab")),
        views: Array.from(document.querySelectorAll(".view")),
        importDb: $("importDb"),
        importButton: $("importButton"),
        settingsButton: $("settingsButton"),
        settingsModal: $("settingsModal"),
        closeSettings: $("closeSettings"),
        resetValidationButtons: Array.from(document.querySelectorAll("[data-reset-validation]")),
        downloadDb: $("downloadDb"),
        exportDb: $("exportDb"),
        listFilterButtons: Array.from(document.querySelectorAll("[data-list-filter-button]")),
        listFilterPopovers: Array.from(document.querySelectorAll("[data-list-filter-popover]")),
        listFilterInputs: Array.from(document.querySelectorAll("[data-list-filter]")),
        countrySearch: $("countrySearch"),
        countrySort: $("countrySort"),
        countryList: $("countryList"),
        countryEditor: $("countryEditor"),
        newCountry: $("newCountry"),
        productSearch: $("productSearch"),
        productSort: $("productSort"),
        productList: $("productList"),
        productEditor: $("productEditor"),
        newProduct: $("newProduct"),
        newSkuProduct: $("newSkuProduct"),
        skuProductSearch: $("skuProductSearch"),
        skuProductSort: $("skuProductSort"),
        skuProductList: $("skuProductList"),
        skuEditor: $("skuEditor"),
        bundleSearch: $("bundleSearch"),
        bundleSort: $("bundleSort"),
        bundleList: $("bundleList"),
        bundleEditor: $("bundleEditor"),
        newBundle: $("newBundle"),
        saveBundle: null,
        deleteBundle: null
      };

      const text = (value) => String(value == null ? "" : value).trim();
      const clone = (value) => structuredClone(value);
      const normalize = (value) => text(value).normalize("NFKD").replace(/[\u0300-\u036f]/g, "").toLowerCase().replace(/[^a-z0-9]+/g, " ").replace(/\s+/g, " ").trim();
      const esc = (value) => String(value == null ? "" : value).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#39;");
      const labels = { yes: "Yes", no: "No", temp: "Temporary", us: "US", retailer: "Retailer", europe: "Europe", usa: "USA", canada: "Canada", hong_kong_taiwan: "Hong Kong / Taiwan", australia: "Australia", rest_of_world: "Rest of world", check_retailer: "Check with retailer" };
      const label = (value) => labels[value] || text(value).replace(/_/g, " ");
      const optionHtml = (values, current) => values.map((value) => `<option value="${esc(value)}"${value === current ? " selected" : ""}>${esc(label(value))}</option>`).join("");
      const exchangeOptionHtml = (current) => {
        const exchangeLabels = { retailer: "Retailer", us: "Us", temp: "Temp", no: "No" };
        return EXCHANGE_STATUS.map((value) => `<option value="${esc(value)}"${value === current ? " selected" : ""}>${esc(exchangeLabels[value])}</option>`).join("");
      };
      const ids = (scope) => state.db && state.db.ids && state.db.ids[scope] ? state.db.ids[scope] : {};

      function sortByMode(rows, mode) {
        return [...rows].sort((a, b) => {
          if (mode === "id") {
            return a.id.localeCompare(b.id, undefined, { numeric: true });
          }
          if (mode === "data") {
            const aHasData = a.record ? 0 : 1;
            const bHasData = b.record ? 0 : 1;
            if (aHasData !== bHasData) return aHasData - bHasData;
          }
          return a.name.localeCompare(b.name);
        });
      }

      function regionClass(zone) {
        return `region-${text(zone) || "rest_of_world"}`;
      }

      function warrantyOptions(current) {
        return [1, 2, 3, 4, 5].map((value) => `<option value="${value}"${String(current) === String(value) ? " selected" : ""}>${value}</option>`).join("");
      }

      function defaultCountryRecord() {
        return { ga_zone: "rest_of_world", rma: { status: "no", warranty_duration: "check_retailer" }, spare_parts: { status: "no", warranty_duration: "check_retailer" }, note: "" };
      }

      function reconcileCountryRecords(db) {
        const countryIds = db.ids && db.ids.countries ? db.ids.countries : {};
        const validIds = new Set(Object.keys(countryIds));
        let changed = false;
        db.countries ||= {};
        Object.keys(db.countries).forEach((id) => {
          if (validIds.has(id)) return;
          delete db.countries[id];
          changed = true;
        });
        const checkedCountries = db.checked && db.checked.countries;
        if (checkedCountries) {
          Object.keys(checkedCountries).forEach((id) => {
            if (validIds.has(id)) return;
            delete checkedCountries[id];
            changed = true;
          });
        }
        return changed;
      }

      function countries() {
        const rows = Object.entries(ids("countries")).map(([id, meta]) => {
          const sourceRecord = state.db.countries[id];
          const record = sourceRecord && typeof sourceRecord === "object" && !Array.isArray(sourceRecord)
            ? sourceRecord
            : defaultCountryRecord();
          return { id, name: text(meta.name || meta.label_en || meta.label_fr) || id, aliases: Array.isArray(meta.aliases) ? meta.aliases : [], record, dataState: getCountryDataState(sourceRecord) };
        });
        return sortByMode(rows, state.countrySort);
      }

      function getCountryDataState(record) {
        if (!record || typeof record !== "object" || Array.isArray(record)) return "empty";
        const serviceIsComplete = (service) => service && typeof service === "object" && STATUS.includes(service.status) && (service.warranty_duration === "check_retailer" || [1, 2, 3, 4, 5].includes(Number(service.warranty_duration)));
        return ZONES.includes(record.ga_zone) && serviceIsComplete(record.rma) && serviceIsComplete(record.spare_parts)
          ? "complete"
          : "partial";
      }

      function matchesListFilters(scope, id, { empty = false } = {}) {
        const active = Object.entries(state.listFilters[scope] || {}).filter(([, enabled]) => enabled).map(([name]) => name);
        if (!active.length) return true;
        return active.some((filter) => (filter === "validated" && isChecked(scope, id)) || (filter === "unvalidated" && !isChecked(scope, id)) || (filter === "empty" && empty));
      }

      function products() {
        const rows = Object.entries(ids("products")).map(([id, meta]) => ({
          id,
          name: text(meta.name) || id,
          crmId: text(meta.crm_id),
          aliases: Array.isArray(meta.aliases) ? meta.aliases.map(text).filter(Boolean) : [],
          record: hasProductGaData(state.db.products[id]) ? state.db.products[id] : null
        }));
        return sortByMode(rows, state.productSort);
      }

      function hasProductGaData(record) {
        return !!(
          record &&
          typeof record === "object" &&
          !Array.isArray(record) &&
          Object.keys(record).some((key) => key !== "skus")
        );
      }

      function productHasNote(record) {
        if (!record) return false;
        if (text(record.note)) return true;
        return Object.values(record.zones || {}).some((zone) => text(zone && zone.note));
      }

      function normalizeSkuValues(value) {
        const values = Array.isArray(value) ? value : String(value == null ? "" : value).split(/\r?\n/);
        return Array.from(new Set(values.map(text).filter(Boolean)));
      }

      function readProductSkuData(record) {
        const raw = record && record.skus && typeof record.skus === "object" && !Array.isArray(record.skus) ? record.skus : {};
        const canonical = Object.prototype.hasOwnProperty.call(raw, "global") || Object.prototype.hasOwnProperty.call(raw, "regions") || Object.prototype.hasOwnProperty.call(raw, "countries");
        const countries = canonical && raw.countries && typeof raw.countries === "object" && !Array.isArray(raw.countries)
          ? raw.countries
          : canonical
            ? {}
            : raw;
        const regions = canonical && raw.regions && typeof raw.regions === "object" && !Array.isArray(raw.regions)
          ? raw.regions
          : {};
        return { global: canonical ? text(raw.global) : "", regions, countries };
      }

      function productSkuEntries(record) {
        return Object.entries(readProductSkuData(record).countries)
          .map(([countryId, value]) => [countryId, normalizeSkuValues(value).slice(0, 1)])
          .filter(([countryId, values]) => countryId && values.length);
      }

      function productSkuRows(record) {
        return Object.entries(readProductSkuData(record).countries).map(([countryId, value]) => [countryId, normalizeSkuValues(value).slice(0, 1)]).filter(([countryId]) => countryId);
      }

      function productSkuRegionRows(record) {
        const regions = readProductSkuData(record).regions;
        return ZONES.map((regionId) => [regionId, normalizeSkuValues(regions[regionId]).slice(0, 1)]);
      }

      function skuProducts() {
        const rows = Object.entries(ids("products"))
          .map(([id, meta]) => ({
            id,
            name: text(meta.name) || id,
            crmId: text(meta.crm_id),
            aliases: Array.isArray(meta.aliases) ? meta.aliases.map(text).filter(Boolean) : [],
            record: state.db.products[id] || null
          }));
        return sortByMode(rows, state.skuProductSort);
      }

      function cleanProductSkus(product) {
        if (!product) return;
        const data = readProductSkuData(product);
        const countries = {};
        const regions = {};
        Object.entries(data.countries).forEach(([countryId, value]) => {
          const values = normalizeSkuValues(value);
          if (countryId && values.length) countries[countryId] = values[0];
        });
        Object.entries(data.regions).forEach(([regionId, value]) => {
          const values = normalizeSkuValues(value);
          if (ZONES.includes(regionId) && values.length) regions[regionId] = values[0];
        });
        if (!data.global && !Object.keys(regions).length && !Object.keys(countries).length) {
          delete product.skus;
          return;
        }
        product.skus = {};
        if (data.global) product.skus.global = data.global;
        if (Object.keys(regions).length) product.skus.regions = regions;
        if (Object.keys(countries).length) product.skus.countries = countries;
      }

      function ensureProductSkus(id) {
        if (!ids("products")[id]) return null;
        const product = state.db.products[id] ||= {};
        const data = readProductSkuData(product);
        product.skus = { global: data.global, regions: { ...data.regions }, countries: { ...data.countries } };
        return product.skus;
      }

      function checkedStore(scope) {
        state.db.checked ||= {};
        state.db.checked[scope] ||= {};
        return state.db.checked[scope];
      }

      function isChecked(scope, id) {
        return !!(state.db.checked && state.db.checked[scope] && state.db.checked[scope][id]);
      }

      function checkedClass(scope, id) {
        return isChecked(scope, id) ? " is-checked" : "";
      }

      function verifiedCheckbox(scope, id, labelText = "Checked") {
        return `<label class="checkline"><input type="checkbox" data-verified="${esc(scope)}" data-verified-id="${esc(id)}" ${isChecked(scope, id) ? "checked" : ""}> ${esc(labelText)}</label>`;
      }

      function bindVerifiedCheckbox(root, afterChange) {
        root.querySelectorAll("[data-verified]").forEach((input) => {
          input.addEventListener("change", () => {
            const store = checkedStore(input.dataset.verified);
            if (input.checked) store[input.dataset.verifiedId] = true;
            else delete store[input.dataset.verifiedId];
            markDirty();
            afterChange();
          });
        });
      }

      function bundles() {
        const rows = Object.entries(ids("bundles")).map(([id, meta]) => ({
          id,
          name: text(meta.name) || id,
          products: Array.isArray(meta.products) ? meta.products : [],
          aliases: Array.isArray(meta.aliases) ? meta.aliases : [],
          notes: text(meta.notes)
        }));
        return sortByMode(rows, state.bundleSort);
      }

      function countryName(id) {
        const meta = ids("countries")[id];
        return text(meta && (meta.name || meta.label_en || meta.label_fr)) || id;
      }

      function productName(id) {
        const meta = ids("products")[id];
        return text(meta && meta.name) || id;
      }

      function nextScopedId(scope, prefix) {
        const used = new Set(Object.keys(ids(scope)));
        let index = used.size + 1;
        let id = "";
        do {
          id = `${prefix}${String(index).padStart(3, "0")}`;
          index += 1;
        } while (used.has(id));
        return id;
      }

      function setServiceStatus(target, status, active) {
        target.status = active ? "yes" : "no";
        if (status === "temp") {
          target.status = "temp";
        }
      }

      function serviceToggleHtml(name, status) {
        const active = status === "yes";
        const stateLabel = active ? "Yes" : "No";
        return `
          <div class="toggle-row is-${esc(status)}">
            <label class="switch">
              <input type="checkbox" data-service-toggle ${active ? "checked" : ""}>
              <span class="slider"></span>
            </label>
            <span class="toggle-state ${esc(status)}">${esc(stateLabel)}</span>
          </div>
        `;
      }

      function serviceCardHtml(name, title, status, control = "") {
        return `
          <div class="service-card${control ? " has-control" : ""}" data-service="${esc(name)}">
            <div class="service-head">
              <label>${esc(title)}</label>
              <div class="service-head-actions">
                ${serviceToggleHtml(name, status)}
                <label class="checkline temporary-check"><input type="checkbox" data-service-temp ${status === "temp" ? "checked" : ""}> Temporary</label>
              </div>
            </div>
            ${control ? `<div class="service-control">${control}</div>` : ""}
          </div>
        `;
      }

      function bindServiceToggle(root, getTarget, afterChange) {
        root.querySelectorAll("[data-service]").forEach((row) => {
          const name = row.dataset.service;
          const toggle = row.querySelector("[data-service-toggle]");
          const temp = row.querySelector("[data-service-temp]");
          const update = () => {
            setServiceStatus(getTarget(name), temp.checked ? "temp" : "", toggle.checked);
            afterChange();
          };
          toggle.addEventListener("change", () => {
            if (toggle.checked) temp.checked = false;
            update();
          });
          temp.addEventListener("change", update);
        });
      }

      function markDirty() {
        state.dirty = true;
        state.db.updatedAt = new Date().toISOString();
        persistDraft();
        renderStatus();
      }

      function persistDraft() {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(state.db));
          return true;
        } catch (error) {
          console.warn("Unable to save the CairmDB draft.", error);
          return false;
        }
      }

      function ensureCountry(id) {
        if (!state.db.countries[id] || typeof state.db.countries[id] !== "object" || Array.isArray(state.db.countries[id])) {
          state.db.countries[id] = defaultCountryRecord();
        }
        if (!state.db.countries[id].rma || typeof state.db.countries[id].rma !== "object") state.db.countries[id].rma = {};
        if (!state.db.countries[id].spare_parts || typeof state.db.countries[id].spare_parts !== "object") state.db.countries[id].spare_parts = {};
        return state.db.countries[id];
      }

      function defaultZone() {
        return { rma: { status: "no", location: "", paid: { location: "", price: null }, default_transport_fee: null, extra_transport_fees: {} }, spare_parts: { status: "no" }, exchange: { status: "" }, note: "" };
      }

      function ensureProduct(id) {
        if (!state.db.products[id] || typeof state.db.products[id] !== "object" || Array.isArray(state.db.products[id])) {
          state.db.products[id] = { zones: {}, note: "" };
        }
        if (!state.db.products[id].zones || typeof state.db.products[id].zones !== "object") state.db.products[id].zones = {};
        return state.db.products[id];
      }

      function ensureProductZone(id, zoneName) {
        const product = ensureProduct(id);
        if (!product.zones[zoneName] || typeof product.zones[zoneName] !== "object" || Array.isArray(product.zones[zoneName])) {
          product.zones[zoneName] = defaultZone();
        }
        const zone = product.zones[zoneName];
        if (!zone.rma || typeof zone.rma !== "object") zone.rma = {};
        if (!zone.rma.paid || typeof zone.rma.paid !== "object") zone.rma.paid = { location: "", price: null };
        if (!zone.rma.extra_transport_fees || typeof zone.rma.extra_transport_fees !== "object") zone.rma.extra_transport_fees = {};
        if (!zone.spare_parts || typeof zone.spare_parts !== "object") zone.spare_parts = {};
        if (!zone.exchange || typeof zone.exchange !== "object") zone.exchange = {};
        return product.zones[zoneName];
      }

      function zoneForDisplay(zone) {
        const fallback = defaultZone();
        return {
          ...fallback,
          ...(zone || {}),
          rma: {
            ...fallback.rma,
            ...((zone && zone.rma) || {}),
            paid: { ...fallback.rma.paid, ...((zone && zone.rma && zone.rma.paid) || {}) },
            extra_transport_fees: { ...((zone && zone.rma && zone.rma.extra_transport_fees) || {}) }
          },
          spare_parts: { ...fallback.spare_parts, ...((zone && zone.spare_parts) || {}) },
          exchange: { ...fallback.exchange, ...((zone && zone.exchange) || {}) }
        };
      }

      function nextBundleId() {
        const used = new Set(Object.keys(ids("bundles")));
        let index = used.size + 1;
        let id = "";
        do {
          id = `B${String(index).padStart(3, "0")}`;
          index += 1;
        } while (used.has(id));
        return id;
      }

      function addCountry() {
        if (!state.db) return;
        state.previousCountryId = state.selectedCountryId;
        const id = nextScopedId("countries", "C");
        const name = `New country ${id}`;
        state.db.ids.countries[id] = { name, label_fr: name, aliases: [name], _source: { file: "cairmdb-manager" } };
        state.db.countries[id] = {
          ga_zone: "rest_of_world",
          rma: { status: "no", warranty_duration: "check_retailer" },
          spare_parts: { status: "no", warranty_duration: 2 },
          note: ""
        };
        state.selectedCountryId = id;
        markDirty();
        renderWws();
      }

      function addProduct() {
        if (!state.db) return;
        state.previousProductId = state.selectedProductId;
        const id = nextScopedId("products", "P");
        const name = `New product ${id}`;
        state.db.ids.products[id] = { name, aliases: [name], crm_id: "", _source: { file: "cairmdb-manager" } };
        ensureProduct(id);
        state.selectedProductId = id;
        markDirty();
        renderGa();
      }

      function addSkuProduct() {
        if (!state.db) return;
        state.previousProductId = state.selectedProductId;
        state.previousSkuProductId = state.selectedSkuProductId;
        const id = nextScopedId("products", "P");
        const name = `New SKU product ${id}`;
        state.db.ids.products[id] = { name, aliases: [name], crm_id: "", _source: { file: "cairmdb-manager" } };
        ensureProduct(id);
        state.selectedProductId = id;
        state.selectedSkuProductId = id;
        markDirty();
        setView("sku");
        renderGa();
        renderSkuView();
      }

      function deleteProduct(id) {
        if (!id || !ids("products")[id]) return;
        const name = productName(id);
        if (!confirm(`Delete product ${name} (${id})?`)) return;
        delete state.db.ids.products[id];
        delete state.db.products[id];
        if (state.db.checked && state.db.checked.products) delete state.db.checked.products[id];
        if (state.db.checked && state.db.checked.skus) delete state.db.checked.skus[id];
        Object.values(ids("bundles")).forEach((bundle) => {
          if (Array.isArray(bundle.products)) {
            bundle.products = bundle.products.filter((productId) => productId !== id);
          }
        });
        syncActiveBundles();
        state.selectedProductId = ids("products")[state.previousProductId] ? state.previousProductId : products()[0] ? products()[0].id : "";
        state.selectedSkuProductId = ids("products")[state.previousSkuProductId] ? state.previousSkuProductId : skuProducts()[0] ? skuProducts()[0].id : "";
        markDirty();
        renderGa();
        renderSkuView();
        renderBundlesView();
      }

      function deleteCountry(id) {
        if (!id || !ids("countries")[id]) return;
        if (!confirm(`Delete country ${countryName(id)} (${id})?`)) return;
        delete state.db.ids.countries[id];
        delete state.db.countries[id];
        if (state.db.checked && state.db.checked.countries) delete state.db.checked.countries[id];
        state.selectedCountryId = ids("countries")[state.previousCountryId] ? state.previousCountryId : countries()[0] ? countries()[0].id : "";
        markDirty();
        renderWws();
      }

      function renderStatus() {
        if (!state.db) return;
        els.status.textContent = state.dirty ? "Local changes" : "CairmDB ready";
      }

      function renderHome() {
        const statsBox = $("homeStats");
        const summaryBox = $("homeSummary");
        const detailsBox = $("homeDetails");
        const datesBox = $("homeDates");
        if (!statsBox || !summaryBox || !detailsBox || !datesBox) return;
        if (!state.db) {
          statsBox.innerHTML = "";
          summaryBox.innerHTML = "";
          detailsBox.innerHTML = "";
          datesBox.innerHTML = "";
          return;
        }
        const scopes = ["countries", "products", "skus", "bundles"];
        const scopeLabel = { countries: "Countries", products: "Products", skus: "SKU products", bundles: "Bundles" };
        const counts = {
          countries: Object.keys(ids("countries")).length,
          products: Object.keys(ids("products")).length,
          skus: skuProducts().length,
          bundles: Object.keys(ids("bundles")).length
        };
        statsBox.innerHTML = scopes.map((scope) => `<div class="home-stat"><strong>${counts[scope]}</strong><span>${scopeLabel[scope]}</span></div>`).join("");
        const total = scopes.reduce((sum, scope) => sum + counts[scope], 0);
        const checkedCount = (scope) => Object.keys((state.db.checked && state.db.checked[scope]) || {}).filter((id) => {
          if (scope === "countries") return Boolean(ids("countries")[id]);
          if (scope === "bundles") return Boolean(ids("bundles")[id]);
          return Boolean(ids("products")[id]);
        }).length;
        const checked = scopes.reduce((sum, scope) => sum + checkedCount(scope), 0);
        const countryData = countries();
        const productsWithoutData = products().filter((product) => !product.record).length;
        const skuWithoutData = skuProducts().filter((product) => {
          const sku = readProductSkuData(product.record);
          return !sku.global && !Object.values(sku.regions).some((value) => normalizeSkuValues(value).length) && !productSkuEntries(product.record).length;
        }).length;
        const bundlesWithoutProducts = bundles().filter((bundle) => !bundle.products.length).length;
        summaryBox.innerHTML = `
          <div><strong>${checked} / ${total}</strong><span>Checked records</span></div>
          <div><strong>${Math.max(total - checked, 0)}</strong><span>Not checked</span></div>
          <div><strong>${countryData.filter((country) => country.dataState === "empty").length + productsWithoutData}</strong><span>Records without data</span></div>
        `;
        const details = [
          ["Countries", counts.countries - checkedCount("countries"), countryData.filter((country) => country.dataState === "empty").length, "without data"],
          ["GA products", counts.products - checkedCount("products"), productsWithoutData, "without data"],
          ["SKU products", counts.skus - checkedCount("skus"), skuWithoutData, "without SKU data"],
          ["Bundles", counts.bundles - checkedCount("bundles"), bundlesWithoutProducts, "without products"]
        ];
        detailsBox.innerHTML = details.map(([labelText, notChecked, missing, missingLabel]) => `<div class="home-detail"><strong>${labelText}</strong><span>${notChecked} not checked</span><span class="attention">${missing} ${missingLabel}</span></div>`).join("");
        const formatDate = (value) => {
          const date = new Date(value);
          return Number.isNaN(date.getTime()) ? "Not available" : new Intl.DateTimeFormat("en-GB", { dateStyle: "medium", timeStyle: "short" }).format(date);
        };
        datesBox.innerHTML = `<span><strong>Database updated:</strong> ${formatDate(state.db.updatedAt)}</span>`;
      }

      function setView(view) {
        state.activeView = view;
        els.tabs.forEach((tab) => tab.setAttribute("aria-selected", String(tab.dataset.view === view)));
        els.views.forEach((section) => section.classList.toggle("is-active", section.id === `view-${view}`));
        if (view === "home") renderHome();
      }

      function renderCountryList() {
        const query = normalize(els.countrySearch.value);
        const visible = countries().filter((country) => {
          const matchesQuery = !query || normalize([
            country.id, country.name, country.aliases.join(" "), country.record.ga_zone, country.record.note
          ].join(" ")).includes(query);
          return matchesQuery && matchesListFilters("countries", country.id, { empty: country.dataState === "empty" });
        });
        els.countryList.innerHTML = visible.map(({ id, name, record, dataState }) => `
          <button type="button" class="item${id === state.selectedCountryId ? " is-active" : ""}${checkedClass("countries", id)}${dataState === "empty" ? " has-no-data" : ""}" data-country="${esc(id)}">
            <span class="title-row"><strong>${esc(name)}</strong><span class="meta">${esc(id)} · ${esc(label(record.ga_zone))}</span></span>
            <span class="country-statuses"><span class="badge ${esc(record.spare_parts && record.spare_parts.status)}">SP ${esc(label(record.spare_parts && record.spare_parts.status))}</span><span class="badge ${esc(record.rma && record.rma.status)}">RMA ${esc(label(record.rma && record.rma.status))}</span>${text(record.note) ? '<span class="badge note-badge">Note</span>' : ""}</span>
          </button>
        `).join("") || '<div class="empty">No countries</div>';
        els.countryList.querySelectorAll("[data-country]").forEach((button) => button.addEventListener("click", () => {
          if (state.selectedCountryId !== button.dataset.country) state.previousCountryId = state.selectedCountryId;
          state.selectedCountryId = button.dataset.country;
          renderWws();
        }));
      }

      function renderCountryEditor() {
        const id = state.selectedCountryId || (countries()[0] && countries()[0].id);
        if (!id) {
          els.countryEditor.innerHTML = '<div class="empty">No country loaded</div>';
          return;
        }
        state.selectedCountryId = id;
        const record = ensureCountry(id);
        const rmaCheckRetailer = record.rma.warranty_duration === "check_retailer";
        const sparePartsControl = record.spare_parts.status === "yes"
          ? `<div class="field"><label>Warranty duration</label><select data-country-field="spare_parts.warranty_duration">${warrantyOptions(record.spare_parts.warranty_duration)}</select></div>`
          : "";
        const rmaControl = record.rma.status === "yes"
          ? `<div class="field"><div class="service-head"><label>Warranty duration</label><label class="checkline"><input id="rmaCheckRetailer" type="checkbox" ${rmaCheckRetailer ? "checked" : ""}> Check with retailer</label></div><select id="rmaWarrantyInput" class="${rmaCheckRetailer ? "hidden" : ""}" data-country-field="rma.warranty_duration">${warrantyOptions(record.rma.warranty_duration)}</select></div>`
          : "";
        els.countryEditor.innerHTML = `

      function zoneTabsHtml() {
        return `<div class="zone-tabs">${ZONES.map((zone) => `<button type="button" class="zone-tab region-pill ${esc(regionClass(zone))}${zone === state.selectedZone ? " is-active" : ""}" data-zone="${esc(zone)}">${esc(label(zone))}</button>`).join("")}</div>`;

      function bindZoneTabs(root) {
        root.querySelectorAll("[data-zone]").forEach((button) => button.addEventListener("click", () => {
          state.selectedZone = button.dataset.zone;
          renderGa();
        }));

      function setPath(target, path, value) {
        const parts = path.split(".");
        let cursor = target;
        while (parts.length > 1) {
          const key = parts.shift();
          cursor[key] ||= {};
          cursor = cursor[key];
        }
        cursor[parts[0]] = value;
      }

      function feeToText(value) {
        if (value === null || value === undefined) return "";
        if (typeof value === "object") {
          return [value.amount == null ? "" : value.amount, value.currency || ""].map(text).filter(Boolean).join(" ");
        }
        return text(value);
      }

      function paidDisplayStatus(paid) {
        if (!paid) return "no";
        if (paid.status) return paid.status;
        return (paid.location || feeToText(paid.price)) ? "yes" : "no";
      }

      function countryOptions(current) {
        return countries().map(({ id, name }) => `<option value="${esc(id)}"${id === current ? " selected" : ""}>${esc(id)} · ${esc(name)}</option>`).join("");
      }

      function resolveLocationId(value) {
        const current = text(value);
        if (!current) return "";
        const locations = ids("locations");
        if (locations[current]) return current;
        const match = Object.entries(locations).find(([id, location]) => {
          const names = [location && location.name, ...((location && location.aliases) || [])];
          return names.some((name) => normalize(name) === normalize(current));
        });
        return match ? match[0] : current;
      }

      function locationOptions(current) {
        const resolved = resolveLocationId(current);
        const locations = ids("locations");
        const options = [`<option value=""${resolved ? "" : " selected"}></option>`];
        RMA_LOCATION_IDS.forEach((id) => {
          const location = locations[id];
          if (!location) return;
          options.push(`<option value="${esc(id)}"${id === resolved ? " selected" : ""}>${esc(location && location.name || id)}</option>`);
        });
        return options.join("");
      }

        bindVerifiedCheckbox(els.productEditor, () => {

        bindServiceToggle(els.productEditor, (name) => {

      function skuCountryOptions(current) {
        const options = countries().map(({ id, name }) => `<option value="${esc(id)}"${id === current ? " selected" : ""}>${esc(id)} · ${esc(name)}</option>`);

          options.unshift(`<option value="${esc(current)}" selected>${esc(current)} · Missing country</option>`);
        }
        return options.join("");
      }

      function renderSkuProductList() {
        const query = normalize(els.skuProductSearch.value);
        const visible = skuProducts().filter((product) => {
          const globalSku = readProductSkuData(product.record).global;
          const regionSkus = Object.entries(readProductSkuData(product.record).regions).flatMap(([regionId, value]) => [regionId, ...normalizeSkuValues(value)]);
          const countryEntries = productSkuEntries(product.record);
          const skuSearchText = countryEntries
            .flatMap(([countryId, values]) => [countryId, countryName(countryId), ...values])
            .join(" ");
          const hasSkuData = Boolean(globalSku || regionSkus.length || countryEntries.length);
          return matchesListFilters("skus", product.id, { empty: !hasSkuData }) && (!query || normalize([product.id, product.name, product.crmId, product.aliases.join(" "), globalSku, regionSkus.join(" "), skuSearchText].join(" ")).includes(query));
        });
        els.skuProductList.innerHTML = visible.map((product) => {
          const globalSku = readProductSkuData(product.record).global;
          const entries = productSkuEntries(product.record);
          const regionCount = Object.values(readProductSkuData(product.record).regions).filter((value) => normalizeSkuValues(value).length).length;
          const skuSummary = [
            globalSku ? "Default" : "",
            regionCount ? `${regionCount} region${regionCount > 1 ? "s" : ""}` : "",
            entries.length ? `${entries.length} countries` : ""
          ].filter(Boolean).join(" · ");
          return `
            <button type="button" class="item${product.id === state.selectedSkuProductId ? " is-active" : ""}${checkedClass("skus", product.id)}" data-sku-product="${esc(product.id)}">
              <span class="title-row"><strong>${esc(product.name)}</strong><span class="meta">${esc(product.id)}</span></span>

          `;

          state.selectedSkuProductId = button.dataset.skuProduct;
          renderSkuView();
        }));

        bindVerifiedCheckbox(els.skuEditor, () => {

        $("globalSku").addEventListener("input", (event) => {

          renderSkuProductList();

        els.skuEditor.querySelectorAll("[data-sku-region]").forEach((row) => {

            renderSkuProductList();

          const skus = ensureProductSkus(id);
          const usedCountries = new Set(Object.keys(skus.countries));

          skus.countries[firstAvailableCountry.id] = "";

        const visible = bundles().filter((bundle) => matchesListFilters("bundles", bundle.id) && (!query || normalize([bundle.id, bundle.name, bundle.products.map(productName).join(" ")].join(" ")).includes(query)));
        els.bundleList.innerHTML = visible.map((bundle) => `
          <button type="button" class="item${bundle.id === state.selectedBundleId ? " is-active" : ""}${checkedClass("bundles", bundle.id)}" data-bundle="${esc(bundle.id)}">
            <strong>${esc(bundle.name)}</strong>
            <span class="meta">${esc(bundle.id)} · ${bundle.products.length} product${bundle.products.length === 1 ? "" : "s"}</span>
          </button>
        `).join("") || '<div class="empty">No bundles</div>';
        els.bundleList.querySelectorAll("[data-bundle]").forEach((button) => button.addEventListener("click", () => {
          if (state.selectedBundleId !== button.dataset.bundle) state.previousBundleId = state.selectedBundleId;
          state.selectedBundleId = button.dataset.bundle;
          renderBundlesView();
        }));
      }

      function currentBundleRecord() {
        return state.selectedBundleId && ids("bundles")[state.selectedBundleId] ? ids("bundles")[state.selectedBundleId] : null;
      }

      function renderBundleEditor() {
        const current = currentBundleRecord();
        const selected = current && Array.isArray(current.products) ? current.products : [];
        const editorBundleId = current ? state.selectedBundleId : nextBundleId();
        els.bundleEditor.innerHTML = `
          <div class="data-card bundle-editor-card editor-form-card">
            <div class="editor-header">
              <div class="editor-title">
                <div class="title-inline">
                  <div class="row-title">${esc(current && current.name || "New bundle")}</div>
                  <div class="editor-id">${esc(editorBundleId)}</div>
                  ${current ? verifiedCheckbox("bundles", state.selectedBundleId) : ""}
                </div>
              </div>
              <div class="actions">
                <button type="button" class="primary" id="saveBundle">Save bundle</button>
                ${current ? '<button type="button" class="danger" id="deleteBundle">Delete</button>' : ""}
              </div>
            </div>
            <div class="editor-section">
              <div class="section-title">Bundle details</div>
              <div class="grid-2 bundle-details-grid">
              <div class="field"><label>Bundle ID</label><input id="bundleId" value="${esc(editorBundleId)}" readonly></div>
              <div class="field"><label>Custom name</label><input id="bundleName" value="${esc(current && current.name)}" placeholder="Bundle name"></div>
              </div>
            </div>
            <div class="editor-section bundle-product-section">
              <div class="section-title">Bundle products</div>
              <div class="list" id="selectedProducts">
                ${selected.map((productId) => `<div class="selected-row" draggable="true" data-selected-product="${esc(productId)}"><span class="drag-handle" title="Drag to reorder">==</span><div><strong>${esc(productName(productId))}</strong><div class="meta">${esc(productId)}</div></div><div class="actions"><button type="button" class="danger" data-remove-product>Remove</button></div></div>`).join("") || '<div class="empty">No products in this bundle</div>'}
              </div>
            </div>
            <div class="editor-section bundle-product-section">
              <div class="section-title">Add from GA</div>
              <div class="field bundle-search-field"><label for="bundleProductSearch">Find a product to add</label><input id="bundleProductSearch" type="search" autocomplete="off" placeholder="Search by product name or ID..."></div>
              <div class="list bundle-results" id="bundleProductResults"></div>
            </div>
          </div>
        `;
        bindVerifiedCheckbox(els.bundleEditor, () => {
          renderBundleList();
          renderBundleEditor();
        });
        renderBundleProductResults();
        $("bundleProductSearch").addEventListener("input", renderBundleProductResults);
        $("saveBundle").addEventListener("click", saveBundle);
        const deleteButton = $("deleteBundle");
        if (deleteButton) deleteButton.addEventListener("click", deleteBundle);
        els.bundleEditor.querySelectorAll("[data-selected-product]").forEach((row) => {
          row.querySelector("[data-remove-product]").addEventListener("click", () => updateCurrentBundleProducts((items) => items.filter((id) => id !== row.dataset.selectedProduct)));
          row.addEventListener("dragstart", (event) => {
            row.classList.add("is-dragging");
            event.dataTransfer.setData("text/plain", row.dataset.selectedProduct);
            event.dataTransfer.effectAllowed = "move";
          });
          row.addEventListener("dragend", () => row.classList.remove("is-dragging"));
          row.addEventListener("dragover", (event) => {
            event.preventDefault();
            event.dataTransfer.dropEffect = "move";
          });
          row.addEventListener("drop", (event) => {
            event.preventDefault();
            const sourceId = event.dataTransfer.getData("text/plain");
            const targetId = row.dataset.selectedProduct;
            if (!sourceId || sourceId === targetId) return;
            updateCurrentBundleProducts((items) => {
              const next = items.filter((item) => item !== sourceId);
              const targetIndex = next.indexOf(targetId);
              next.splice(targetIndex, 0, sourceId);
              return next;
            });
          });
        });
      }

      function saveBundle() {
        const id = text($("bundleId").value) || nextBundleId();
        const name = text($("bundleName").value);
        if (!name) {
          $("bundleName").focus();
          return;
        }
        state.db.ids.bundles ||= {};
        const previous = state.db.ids.bundles[id] || {};
        state.db.ids.bundles[id] = { ...previous, name, products: Array.isArray(previous.products) ? previous.products : [], aliases: [name], _source: { file: "cairmdb-manager" } };
        state.selectedBundleId = id;
        syncActiveBundles();
        markDirty();
        renderBundlesView();
      }

      function syncActiveBundles() {
        state.db.activeBundles = bundles().map((bundle) => ({ id: bundle.id, name: bundle.name, status: "manual", composition: bundle.products.map(productName).join(" + "), products: bundle.products, source: "cairmdb-manager" }));
      }

      function ensureDraftBundle() {
        if (state.selectedBundleId && ids("bundles")[state.selectedBundleId]) return state.selectedBundleId;
        const id = $("bundleId") ? text($("bundleId").value) : nextBundleId();
        state.db.ids.bundles[id] = { name: text($("bundleName") && $("bundleName").value) || id, products: [], aliases: [], _source: { file: "cairmdb-manager" } };
        state.selectedBundleId = id;
        return id;
      }

      function updateCurrentBundleProducts(transform) {
        const id = ensureDraftBundle();
        state.db.ids.bundles[id].products = transform([...(state.db.ids.bundles[id].products || [])]);
        syncActiveBundles();
        markDirty();
        renderBundlesView();
      }

      function renderBundleProductResults() {
        const box = $("bundleProductResults");
        const input = $("bundleProductSearch");
        if (!box || !input) return;
        const query = normalize(input.value);
        if (!query) {
          box.innerHTML = '<div class="empty">Enter a search to show products</div>';
          return;
        }
        const selected = new Set(currentBundleRecord() && currentBundleRecord().products || []);
        const visible = products().filter((product) => !selected.has(product.id)).filter((product) => !query || normalize([product.id, product.name, product.crmId, product.aliases.join(" ")].join(" ")).includes(query)).slice(0, 80);
        box.innerHTML = visible.map((product) => `<div class="product-row" data-add-product="${esc(product.id)}"><div><strong>${esc(product.name)}</strong><div class="meta">${esc(product.id)}</div></div><button type="button">Add</button></div>`).join("") || '<div class="empty">No products found</div>';
        box.querySelectorAll("[data-add-product]").forEach((row) => row.querySelector("button").addEventListener("click", () => updateCurrentBundleProducts((items) => [...items, row.dataset.addProduct])));
      }

      function newBundle() {
        state.previousBundleId = state.selectedBundleId;
        state.selectedBundleId = "";
        renderBundlesView();
        $("bundleName").focus();
      }

      function deleteBundle() {
        if (!state.selectedBundleId) return;
        delete state.db.ids.bundles[state.selectedBundleId];
        if (state.db.checked && state.db.checked.bundles) delete state.db.checked.bundles[state.selectedBundleId];
        state.selectedBundleId = ids("bundles")[state.previousBundleId] ? state.previousBundleId : bundles()[0] ? bundles()[0].id : "";
        syncActiveBundles();
        markDirty();
        renderBundlesView();
      }

      function renderBundlesView() {
        renderBundleList();
        renderBundleEditor();
        renderStatus();
      }

      function renderAll() {
        renderHome();
        renderWws();
        renderGa();
        renderSkuView();
        renderBundlesView();
      }

      function buildExportDb() {
        const output = clone(state.db);
        reconcileCountryRecords(output);
        Object.values(output.products || {}).forEach(cleanProductSkus);
        output.version = new Date().toISOString().slice(0, 10);
        output.updatedAt = new Date().toISOString();
        return output;
      }

      function parseCsvLine(line) {
        const cells = [];
        let cell = "";
        let quoted = false;
        for (let index = 0; index < line.length; index += 1) {
          const char = line[index];
          const next = line[index + 1];
          if (char === '"' && quoted && next === '"') {
            cell += '"';
            index += 1;
          } else if (char === '"') {
            quoted = !quoted;
          } else if (char === ";" && !quoted) {
            cells.push(cell);
            cell = "";
          } else {
            cell += char;
          }
        }
        cells.push(cell);
        return cells;
      }

      function parseProductListCsv(csv) {
        const lines = text(csv).replace(/^\uFEFF/, "").split(/\r?\n/).filter((line) => text(line));
        if (lines.length < 2) return [];
        const headers = parseCsvLine(lines[0]).map(text);
        return lines.slice(1).map((line, index) => {
          const cells = parseCsvLine(line);
          const row = {};
          headers.forEach((header, cellIndex) => {
            row[header] = text(cells[cellIndex]);
          });
          row.__rowNumber = index + 2;
          return row;
        });
      }

      function nextProductIdFor(productIds) {
        const used = new Set(Object.keys(productIds));
        let index = used.size + 1;
        let id = "";
        do {
          id = `P${String(index).padStart(3, "0")}`;
          index += 1;
        } while (used.has(id));
        return id;
      }

      function mergeProductList(db, csv) {
        db.ids ||= {};
        db.ids.products ||= {};
        const productIds = db.ids.products;
        const existingCrmIds = new Set(Object.values(productIds).map((meta) => text(meta && meta.crm_id)).filter(Boolean));
        const existingNames = new Set(Object.values(productIds).map((meta) => normalize(meta && meta.name)).filter(Boolean));
        let added = 0;
        parseProductListCsv(csv).forEach((row) => {
          const name = text(row.Nom);
          const crmId = text(row.Id);
          if (!name || (crmId && existingCrmIds.has(crmId)) || (!crmId && existingNames.has(normalize(name)))) return;
          const id = nextProductIdFor(productIds);
          productIds[id] = {
            name,
            aliases: [name],
            crm_id: crmId,
            _source: { file: "PL.csv", row: row.__rowNumber }
          };
          if (crmId) existingCrmIds.add(crmId);
          existingNames.add(normalize(name));
          added += 1;
        });
        return added;
      }

      async function exportDbFile() {
        if (!state.db) return;
        const json = `${JSON.stringify(buildExportDb(), null, 2)}\n`;
        if (window.cairmDesktop) {
          const result = await window.cairmDesktop.saveDatabase(json);
          if (result.saved) {
            els.status.textContent = "JSON saved";
          }
          return;
        }
        const blob = new Blob([json], { type: "application/json;charset=utf-8" });
        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        link.href = url;
        link.download = "CairmDB.json";
        document.body.appendChild(link);
        link.click();
        link.remove();
        URL.revokeObjectURL(url);
        els.status.textContent = "JSON export downloaded";
      }

      async function exportDb() {
        if (!state.db) return;
        const json = `${JSON.stringify(buildExportDb(), null, 2)}\n`;
        clearTimeout(copyFeedbackTimer);
        els.exportDb.classList.remove("is-copied", "is-copy-error");
        els.exportDb.classList.add("is-copying");
        els.exportDb.textContent = "Copying…";
        els.exportDb.disabled = true;
        try {
          if (window.cairmDesktop) await window.cairmDesktop.copyDatabase(json);
          else await navigator.clipboard.writeText(json);
          els.status.textContent = "Database copied to clipboard";
          els.exportDb.classList.remove("is-copying");
          els.exportDb.classList.add("is-copied");
          els.exportDb.textContent = "Copied ✓";
        } catch (error) {
          els.status.textContent = "Copy failed, use Save as file instead";
          els.exportDb.classList.remove("is-copying");
          els.exportDb.classList.add("is-copy-error");
          els.exportDb.textContent = "Failed";
        } finally {
          els.exportDb.disabled = false;
          copyFeedbackTimer = window.setTimeout(() => {
            els.exportDb.classList.remove("is-copying", "is-copied", "is-copy-error");
            els.exportDb.textContent = "Copy DB";
          }, 1800);
        }
      }

      function loadIntoState(db, fromDraft) {
        if (!db || typeof db !== "object" || Array.isArray(db)) {
          throw new Error("The JSON root must be an object");
        }
        state.db = db;
        if (!state.db.ids || typeof state.db.ids !== "object" || Array.isArray(state.db.ids)) state.db.ids = {};
        ["countries", "products", "bundles"].forEach((scope) => {
          if (!state.db.ids[scope] || typeof state.db.ids[scope] !== "object" || Array.isArray(state.db.ids[scope])) state.db.ids[scope] = {};
        });
        ["countries", "products", "checked"].forEach((key) => {
          if (!state.db[key] || typeof state.db[key] !== "object" || Array.isArray(state.db[key])) state.db[key] = {};
        });
        ["countries", "products", "skus", "bundles"].forEach((scope) => {
          if (!state.db.checked[scope] || typeof state.db.checked[scope] !== "object" || Array.isArray(state.db.checked[scope])) state.db.checked[scope] = {};
        });
        const countriesRepaired = reconcileCountryRecords(state.db);
        state.sourceDb = clone(state.db);
        state.dirty = !!fromDraft || countriesRepaired;
        if (fromDraft && countriesRepaired) {
          persistDraft();
        }
        state.selectedCountryId = countries()[0] ? countries()[0].id : "";
        state.selectedProductId = products()[0] ? products()[0].id : "";
        state.selectedSkuProductId = skuProducts()[0] ? skuProducts()[0].id : "";
        state.selectedBundleId = bundles()[0] ? bundles()[0].id : "";
        renderAll();
      }

      async function loadDesktopFile() {
        const result = await window.cairmDesktop.openDatabase();
        if (result.canceled) return;
        try {
          loadIntoState(JSON.parse(result.content), true);
          markDirty();
          els.status.textContent = "JSON loaded";
        } catch (error) {
          els.status.textContent = `JSON import error: ${error.message}`;
        }
      }

      async function loadDb() {
        const draft = localStorage.getItem(STORAGE_KEY);
        if (draft) {
          try {
            loadIntoState(JSON.parse(draft), true);
            return;
          } catch (error) {
            localStorage.removeItem(STORAGE_KEY);
            console.warn("Invalid CairmDB draft ignored.", error);
          }
        }
        if (window.cairmDesktop) {
          try {
            const content = await window.cairmDesktop.loadDefaultDatabase();
            loadIntoState(JSON.parse(content), false);
            return;
          } catch (error) {
            els.status.textContent = `Default database load error: ${error.message}`;
            return;
          }
        }
        els.status.textContent = "Import a CairmDB.json file to get started.";
      }

      els.tabs.forEach((tab) => tab.addEventListener("click", () => setView(tab.dataset.view)));
      els.countrySearch.addEventListener("input", renderCountryList);
      function renderFilteredList(scope) {
        if (scope === "countries") renderCountryList();
        else if (scope === "products") renderProductList();
        else if (scope === "skus") renderSkuProductList();
        else if (scope === "bundles") renderBundleList();
      }

      function updateFilterButton(scope) {
        const button = els.listFilterButtons.find((item) => item.dataset.listFilterButton === scope);
        if (button) button.classList.toggle("is-active", Object.values(state.listFilters[scope] || {}).some(Boolean));
      }

      els.listFilterButtons.forEach((button) => button.addEventListener("click", () => {
        const scope = button.dataset.listFilterButton;
        const popover = els.listFilterPopovers.find((item) => item.dataset.listFilterPopover === scope);
        if (!popover) return;
        const willOpen = popover.hidden;
        els.listFilterPopovers.forEach((item) => { item.hidden = true; });
        els.listFilterButtons.forEach((item) => item.setAttribute("aria-expanded", "false"));
        popover.hidden = !willOpen;
        button.setAttribute("aria-expanded", String(willOpen));
      }));
      els.listFilterInputs.forEach((input) => input.addEventListener("change", () => {
        const [scope, filter] = input.dataset.listFilter.split(":");
        state.listFilters[scope][filter] = input.checked;
        updateFilterButton(scope);
        renderFilteredList(scope);
      }));
      document.addEventListener("click", (event) => {
        if (event.target.closest(".filter-menu")) return;
        els.listFilterPopovers.forEach((popover) => { popover.hidden = true; });
        els.listFilterButtons.forEach((button) => button.setAttribute("aria-expanded", "false"));
      });
      els.countrySort.addEventListener("change", () => {
        state.countrySort = els.countrySort.value;
        renderWws();
      });
      els.productSearch.addEventListener("input", renderProductList);
      els.productSort.addEventListener("change", () => {
        state.productSort = els.productSort.value;
        renderGa();
      });
      els.skuProductSearch.addEventListener("input", renderSkuProductList);
      els.skuProductSort.addEventListener("change", () => {
        state.skuProductSort = els.skuProductSort.value;
        renderSkuView();
      });
      els.bundleSearch.addEventListener("input", renderBundleList);
      els.bundleSort.addEventListener("change", () => {
        state.bundleSort = els.bundleSort.value;
        renderBundlesView();
      });
      els.exportDb.addEventListener("click", exportDb);
      els.settingsButton.addEventListener("click", () => {
        els.settingsModal.showModal();
      });
      els.closeSettings.addEventListener("click", () => els.settingsModal.close());
      els.settingsModal.addEventListener("click", (event) => {
        if (event.target === els.settingsModal) els.settingsModal.close();
      });
      els.resetValidationButtons.forEach((button) => button.addEventListener("click", () => {
        const scope = button.dataset.resetValidation;
        const label = { countries: "countries", products: "products", skus: "SKUs", bundles: "bundles" }[scope];
        if (!state.db || !confirm(`Clear all ${label} checks?`)) return;
        state.db.checked[scope] = {};
        markDirty();
        renderAll();
      }));
      els.downloadDb.addEventListener("click", () => { void exportDbFile(); });
      els.newCountry.addEventListener("click", addCountry);
      els.newProduct.addEventListener("click", addProduct);
      els.newSkuProduct.addEventListener("click", addSkuProduct);
      els.importButton.addEventListener("click", () => {
        if (window.cairmDesktop) void loadDesktopFile();
        else els.importDb.click();
      });
      els.importDb.addEventListener("change", async () => {
        const file = els.importDb.files && els.importDb.files[0];
        if (!file) return;
        try {
          loadIntoState(JSON.parse(await file.text()), true);
          markDirty();
          els.status.textContent = "JSON imported";
        } catch (error) {
          els.status.textContent = `JSON import error: ${error.message}`;
        } finally {
          els.importDb.value = "";
        }
      });
      els.newBundle.addEventListener("click", newBundle);

      loadDb();
    })();
  </script>
</body>
</html>
